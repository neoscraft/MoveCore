storage:
  type: json
  json-file: data.json
  mysql:
    jdbc-url: jdbc:mysql://localhost:3306/movecore
    username: root
    password: change-me
    table-prefix: movecore_
teleport:
  warmup-millis: 3000
  cancel-on-move: true
  cooldown-millis: 0
spawn:
  cooldown-millis: 0
  cancel-on-move: true
  void-y: -64
rtp:
  min-radius: 100
  max-radius: 5000
  max-attempts: 32
  blocked-worlds: []
back:
  cooldown-millis: 0
  safe-search-radius: 8
homes:
  default-limit: 1
  limits:
    vip: 3
    premium: 10
warps:
  default-player-limit: 1
  player-limits:
    vip: 3
